[package]
name = "dir_tools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dirt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.13", features = ["derive"] }
crossterm = "0.28.1"
eyre = "0.6.12"
fs2 = "0.4.3"
indicatif = "0.17.8"
open = "5.3.0"
percent-encoding = "2.3.1"
rayon = "1.10.0"
regex = "1.11.1"
url = "2.5.3"
walkdir = "2.5.0"
winapi = { version = "0.3.9", features = ["fileapi", "winnt"] }
