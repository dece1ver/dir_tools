[package]
name = "dir_tools"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/dece1ver/dir_tools"
readme = "README.md"
keywords = ["directories", "tools", "filesystem"]
categories = ["command-line-utilities", "filesystem"]
description = "Набор инструментов для работы с директориями"
license = "Apache-2.0"

[[bin]]
name = "dirt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
crossterm = "0.28.1"
eyre = "0.6.12"
fs2 = "0.4.3"
indicatif = "0.17.11"
open = "5.3.2"
percent-encoding = "2.3.1"
rayon = "1.10.0"
regex = "1.11.1"
url = "2.5.4"
walkdir = "2.5.0"
winapi = { version = "0.3.9", features = ["fileapi", "winnt"] }
