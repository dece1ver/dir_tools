[package]
name = "dir_tools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dirt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.13", features = ["derive"] }
eyre = "0.6.12"
indicatif = "0.17.8"
rayon = "1.10.0"
regex = "1.11.1"
walkdir = "2.5.0"
winapi = { version = "0.3.9", features = ["fileapi", "winnt"] }
